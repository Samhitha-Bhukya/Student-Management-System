# ===================================================================
# Spring Boot Configuration for Student Management System
# Internship Project: Codec Technologies
# ===================================================================

# Application Name & Port
spring.application.name=student-management-system
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection Settings
# -------------------------------------------------------------------
# You can set environment variables DB_URL, DB_USERNAME, DB_PASSWORD,
# or replace the defaults below with your local MySQL credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Settings
# -------------------------------------------------------------------
# update: Updates table schema automatically without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# Thymeleaf View Resolver Settings
# -------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Set cache to false during development so changes reload immediately
spring.thymeleaf.cache=false

# -------------------------------------------------------------------
# Static Resources Configuration (CSS, JS, Images)
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# Logging Level
# -------------------------------------------------------------------
logging.level.com.codectechnologies.sms=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
